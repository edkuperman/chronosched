openapi: 3.0.3
info:
  title: Chronosched API
  version: 1.0.0
servers:
  - url: http://localhost:8080

paths:

  ###############################
  # Health
  ###############################
  /healthz:
    get:
      summary: Health check
      responses:
        '200':
          description: Service healthy
          content:
            text/plain:
              schema:
                type: string
                example: ok

  ###############################
  # Namespaces
  ###############################
  /api/v1/namespaces:
    get:
      summary: List namespaces
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Namespace'
    post:
      summary: Create namespace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NamespaceCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Namespace'

  /api/v1/namespace/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get namespace
      responses:
        '200':
          description: Namespace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Namespace'
    put:
      summary: Rename namespace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NamespaceRenameRequest'
      responses:
        '200':
          description: Renamed
          content:
            application/json:
              schema:
                type: object
                properties:
                  old:
                    type: string
                  new:
                    type: string
    delete:
      summary: Delete namespace
      responses:
        '204':
          description: Deleted

  ###############################
  # DAGs
  ###############################
  /api/v1/dags/{namespace_id}:
    parameters:
      - name: namespace_id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List DAGs in namespace
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DAG'
    post:
      summary: Create DAGs (bulk)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DAGCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DAGCreateResponse'
    put:
      summary: Upsert DAGs (bulk)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DAGCreateRequest'
      responses:
        '207':
          description: Multi-status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DAGUpsertResponse'

  /api/v1/dags/{namespace_id}/{id}:
    parameters:
      - name: namespace_id
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get DAG
      responses:
        '200':
          description: DAG
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DAG'
    put:
      summary: Update DAG name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DAG'
    delete:
      summary: Delete DAG
      responses:
        '204':
          description: Deleted

  ###############################
  # Job Definitions
  ###############################
  /api/v1/definitions/{namespace_id}:
    parameters:
      - name: namespace_id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List definitions
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobDefinition'
    post:
      summary: Create definitions (bulk)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/JobDefinitionCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDefinitionResponse'
    put:
      summary: Upsert definitions (bulk)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/JobDefinitionCreateRequest'
      responses:
        '207':
          description: Multi-status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDefinitionResponse'

  /api/v1/definitions/{namespace_id}/{id}:
    parameters:
      - name: namespace_id
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get definition
      responses:
        '200':
          description: Definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDefinition'
    put:
      summary: Create a new version of a definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobDefinitionCreateRequest'
      responses:
        '200':
          description: New version created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDefinitionUpdateResponse'
    delete:
      summary: Soft-delete a definition version
      responses:
        '204':
          description: Deleted

  ###############################
  # Jobs (DAG-scoped)
  ###############################
  /api/v1/dags/{dag_id}/jobs:
    parameters:
      - name: dag_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List jobs in DAG
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobListItem'
    post:
      summary: Create jobs (bulk)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/JobCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobUpsertResponse'
    put:
      summary: Upsert jobs (bulk)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/JobCreate'
      responses:
        '207':
          description: Multi-status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobUpsertResponse'

  /api/v1/dags/{dag_id}/jobs/{id}:
    parameters:
      - name: dag_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get job
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
    put:
      summary: Update queued job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                priority:
                  type: integer
                due_at:
                  type: string
                  format: date-time
                payload_json:
                  type: object
      responses:
        '204':
          description: Updated
    delete:
      summary: Cancel job
      responses:
        '204':
          description: Cancelled

  ###############################
  # Job lifecycle (DAG scoped)
  ###############################
  /api/v1/dags/{dag_id}/jobs/{jobId}/complete:
    post:
      summary: Mark job complete
      parameters:
        - name: dag_id
          in: path
          required: true
          schema:
            type: string
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Complete

  /api/v1/dags/{dag_id}/jobs/{jobId}/fail:
    post:
      summary: Mark job failed
      parameters:
        - name: dag_id
          in: path
          required: true
          schema:
            type: string
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailRequest'
      responses:
        '204':
          description: Failed

  ###############################
  # Dependencies (DAG-scoped)
  ###############################
  /api/v1/dags/{dag_id}/dependencies:
    parameters:
      - name: dag_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List dependencies or fetch one by parent/child
      parameters:
        - name: parent_id
          in: query
          required: false
          schema:
            type: integer
        - name: child_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Dependencies
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Dependency'
    post:
      summary: Create dependencies (bulk)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DependencyCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
    put:
      summary: Upsert dependencies (bulk)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DependencyCreateRequest'
      responses:
        '207':
          description: Multi-status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
    patch:
      summary: Update dependency type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DependencyCreateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dependency'
    delete:
      summary: Delete dependency (archive to history)
      parameters:
        - name: parent_id
          in: query
          required: true
          schema:
            type: integer
        - name: child_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  dag_id:
                    type: string
                  parent_job_id:
                    type: integer
                  child_job_id:
                    type: integer
                  archived:
                    type: boolean

  ###############################
  # Admin
  ###############################
  /api/v1/admin/check/global-cycles:
    get:
      summary: Detect global cycles across all DAGs
      responses:
        '200':
          description: Results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCheckResponse'

  /api/v1/admin/prune:
    post:
      summary: Archive deleted/finished resources into history tables
      responses:
        '200':
          description: Archive summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_definitions_archived:
                    type: integer
                  dags_archived:
                    type: integer
                  jobs_archived:
                    type: integer
                  dependencies_archived:
                    type: integer

#################################
# COMPONENT SCHEMAS
#################################
components:
  schemas:

    NamespaceCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: demo

    NamespaceRenameRequest:
      type: object
      required:
        - new_name
      properties:
        new_name:
          type: string
          example: prod

    Namespace:
      type: object
      properties:
        namespace_id:
          type: string
          format: uuid
        name:
          type: string

    DAGCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    DAGCreateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer

    DAGUpsertResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        version:
          type: integer
        error:
          type: string

    DAGUpsertResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/DAGUpsertResult'

    DAG:
      type: object
      properties:
        id:
          type: string
          format: uuid
        namespace:
          type: string
        name:
          type: string
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        deleted:
          type: boolean

    JobDefinitionCreateRequest:
      type: object
      required:
        - name
        - kind
        - payload_template
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [cmd, http, binary]
        payload_template:
          type: object
        cron_spec:
          type: string
        delay_interval:
          type: string

    JobDefinition:
      type: object
      properties:
        def_id:
          type: string
        namespace:
          type: string
        name:
          type: string
        version:
          type: integer
        kind:
          type: string
        payload_template:
          type: object
        cron_spec:
          type: string
          nullable: true
        delay_interval:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        deleted:
          type: boolean

    JobDefinitionResult:
      type: object
      properties:
        def_id:
          type: string
        name:
          type: string
        version:
          type: integer
        error:
          type: string

    BulkDefinitionResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/JobDefinitionResult'

    JobDefinitionUpdateResponse:
      type: object
      properties:
        def_id:
          type: string
        namespace:
          type: string
        name:
          type: string
        version:
          type: integer

    JobCreate:
      type: object
      required:
        - def_id
      properties:
        def_id:
          type: string
        payload:
          type: string
        priority:
          type: integer
        due_at:
          type: string
          format: date-time

    Job:
      type: object
      properties:
        id:
          type: integer
        dag_id:
          type: string
        def_id:
          type: string
        status:
          type: string
          enum: [waiting, queued, running, succeeded, failed, cancelled]
        kind:
          type: string
        payload_json:
          type: object
        due_at:
          type: string
          format: date-time

    JobListItem:
      type: object
      required:
        - id
        - def_id
        - dag_id
        - status
      properties:
        id:
          type: integer
        def_id:
          type: string
        dag_id:
          type: string
        status:
          type: string

    JobUpsertResult:
      type: object
      required: [def_id]
      properties:
        def_id:
          type: string
        id:
          type: integer
          format: int64
          nullable: true
        error:
          type: string

    JobUpsertResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/JobUpsertResult'

    DependencyCreateRequest:
      type: object
      required:
        - ParentID
        - ChildID
      properties:
        ParentID:
          type: integer
        ChildID:
          type: integer
        dependency_type:
          type: string
          enum: [order-only, data]

    Dependency:
      type: object
      properties:
        parent_job_id:
          type: integer
        child_job_id:
          type: integer
        dependency_type:
          type: string
          enum: [order-only, data]

    FailRequest:
      type: object
      required:
        - error
      properties:
        error:
          type: string

    CountResponse:
      type: object
      properties:
        count:
          type: integer

    CycleCheckResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            type: object
            properties:
              dag_id:
                type: string
              cycles:
                type: array
                items:
                  type: array
                  items:
                    type: string
