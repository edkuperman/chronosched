openapi: 3.0.3
info:
  title: Chronosched API
  version: 1.0.0
  description: |
    Chronosched is a DAG-oriented workflow scheduler with versioned DAG authoring,
    manual and scheduled runs, worker leasing, run graph inspection, and job
    readiness introspection.

tags:
- name: Health
- name: Namespaces
- name: Job Definitions
- name: DAGs
- name: DAG Versions
- name: Runs
- name: Jobs
- name: Worker Gateway
- name: Admin
paths:
  /healthz:
    get:
      tags:
      - Health
      summary: Health check
      operationId: healthz
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /api/v1/namespaces:
    get:
      tags:
      - Namespaces
      summary: List namespaces
      responses:
        '200':
          description: Namespaces.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamespaceList'
    post:
      tags:
      - Namespaces
      summary: Create namespace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNamespaceRequest'
      responses:
        '201':
          description: Namespace created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Namespace'
  /api/v1/namespaces/{name}:
    get:
      tags:
      - Namespaces
      summary: Get namespace by name
      parameters:
      - $ref: '#/components/parameters/NamespaceName'
      responses:
        '200':
          description: Namespace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Namespace'
  /api/v1/namespaces/{namespace_id}/job-definitions:
    get:
      tags:
      - Job Definitions
      summary: List job definitions in a namespace
      parameters:
      - $ref: '#/components/parameters/NamespaceID'
      responses:
        '200':
          description: Job definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDefinitionList'
  /api/v1/namespaces/{namespace_id}/jobs/problems:
    get:
      tags:
      - Jobs
      summary: List problem jobs in a namespace
      parameters:
      - $ref: '#/components/parameters/NamespaceID'
      - name: dag_id
        in: query
        schema:
          type: string
      - name: status
        in: query
        description: Comma-separated job statuses to include.
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Problem jobs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProblemJob'
  /api/v1/namespaces/{namespace_id}/jobs/{job_id}/restart:
    post:
      tags:
      - Jobs
      summary: Restart a job inside a namespace
      parameters:
      - $ref: '#/components/parameters/NamespaceID'
      - $ref: '#/components/parameters/JobID'
      - name: cascade
        in: query
        schema:
          type: boolean
        description: Defaults to true. When true, reset downstream dependent jobs too.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestartJobRequest'
      responses:
        '200':
          description: Restarted job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestartJobResult'
  /api/v1/job-definitions:
    post:
      tags:
      - Job Definitions
      summary: Create job definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobDefinitionCreate'
      responses:
        '201':
          description: Job definition created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDefinition'
  /api/v1/job-definitions/{definition_id}:
    get:
      tags:
      - Job Definitions
      summary: Get job definition
      parameters:
      - $ref: '#/components/parameters/DefinitionID'
      responses:
        '200':
          description: Job definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDefinition'
    put:
      tags:
      - Job Definitions
      summary: Update job definition
      parameters:
      - $ref: '#/components/parameters/DefinitionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobDefinitionCreate'
      responses:
        '200':
          description: Updated job definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDefinition'
    delete:
      tags:
      - Job Definitions
      summary: Delete job definition
      parameters:
      - $ref: '#/components/parameters/DefinitionID'
      responses:
        '204':
          description: Deleted.
  /api/v1/job-definitions/{definition_id}/enable:
    post:
      tags:
      - Job Definitions
      summary: Enable job definition
      parameters:
      - $ref: '#/components/parameters/DefinitionID'
      responses:
        '204':
          description: Enabled
  /api/v1/job-definitions/{definition_id}/disable:
    post:
      tags:
      - Job Definitions
      summary: Disable job definition
      parameters:
      - $ref: '#/components/parameters/DefinitionID'
      responses:
        '204':
          description: Disabled
  /api/v1/job-definitions/{definition_id}/pause:
    post:
      tags:
      - Job Definitions
      summary: Pause job definition
      parameters:
      - $ref: '#/components/parameters/DefinitionID'
      responses:
        '204':
          description: Paused
  /api/v1/job-definitions/{definition_id}/resume:
    post:
      tags:
      - Job Definitions
      summary: Resume job definition
      parameters:
      - $ref: '#/components/parameters/DefinitionID'
      responses:
        '204':
          description: Resumed
  /api/v1/job-definitions/{definition_id}/usages:
    get:
      tags:
      - Job Definitions
      summary: List where a job definition is used
      parameters:
      - $ref: '#/components/parameters/DefinitionID'
      responses:
        '200':
          description: Usage list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefinitionUsageResponse'
  /api/v1/namespaces/{namespace_id}/dags:
    get:
      tags:
      - DAGs
      summary: List DAGs in a namespace
      parameters:
      - $ref: '#/components/parameters/NamespaceID'
      responses:
        '200':
          description: DAGs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DAGList'
    post:
      tags:
      - DAGs
      summary: Create DAG
      parameters:
      - $ref: '#/components/parameters/NamespaceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDAGRequest'
      responses:
        '201':
          description: DAG created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DAG'
  /api/v1/dags/{dag_id}:
    get:
      tags:
      - DAGs
      summary: Get DAG
      parameters:
      - $ref: '#/components/parameters/DAGID'
      responses:
        '200':
          description: DAG.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DAG'
    delete:
      tags:
      - DAGs
      summary: Delete DAG
      parameters:
      - $ref: '#/components/parameters/DAGID'
      responses:
        '204':
          description: Deleted
  /api/v1/dags/{dag_id}/versions:
    get:
      tags:
      - DAG Versions
      summary: List DAG versions
      parameters:
      - $ref: '#/components/parameters/DAGID'
      responses:
        '200':
          description: DAG versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DAGVersionList'
    post:
      tags:
      - DAG Versions
      summary: Publish DAG version
      parameters:
      - $ref: '#/components/parameters/DAGID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DAGVersionCreate'
      responses:
        '201':
          description: DAG version created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DAGVersion'
  /api/v1/dag-versions/{dag_version_id}:
    get:
      tags:
      - DAG Versions
      summary: Get DAG version
      parameters:
      - $ref: '#/components/parameters/DAGVersionID'
      responses:
        '200':
          description: DAG version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DAGVersion'
  /api/v1/dag-versions/{dag_version_id}/graph:
    get:
      tags:
      - DAG Versions
      summary: Get DAG version graph
      parameters:
      - $ref: '#/components/parameters/DAGVersionID'
      responses:
        '200':
          description: DAG version graph.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DAGVersionGraph'
  /api/v1/dag-versions/{dag_version_id}/activate:
    post:
      tags:
      - DAG Versions
      summary: Activate DAG version
      parameters:
      - $ref: '#/components/parameters/DAGVersionID'
      responses:
        '204':
          description: Activated
  /api/v1/dag-versions/{dag_version_id}/revert:
    post:
      tags:
      - DAG Versions
      summary: Revert DAG version by cloning it into a new version
      parameters:
      - $ref: '#/components/parameters/DAGVersionID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevertDAGVersionRequest'
      responses:
        '201':
          description: Reverted DAG version clone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DAGVersion'
  /api/v1/dags/{dag_id}/runs:
    get:
      tags:
      - Runs
      summary: List runs for a DAG
      parameters:
      - $ref: '#/components/parameters/DAGID'
      responses:
        '200':
          description: Runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunList'
    post:
      tags:
      - Runs
      summary: Trigger a manual run
      parameters:
      - $ref: '#/components/parameters/DAGID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerRunRequest'
      responses:
        '201':
          description: Run created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
  /api/v1/runs/{run_id}:
    get:
      tags:
      - Runs
      summary: Get run
      parameters:
      - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
  /api/v1/runs/{run_id}/jobs:
    get:
      tags:
      - Runs
      summary: List jobs in a run
      parameters:
      - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Run jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunJobList'
  /api/v1/runs/{run_id}/graph:
    get:
      tags:
      - Runs
      summary: Get run graph
      parameters:
      - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Run graph.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunGraph'
  /api/v1/jobs/{job_id}/readiness:
    get:
      tags:
      - Jobs
      summary: Get job readiness and blocking parents
      parameters:
      - $ref: '#/components/parameters/JobID'
      responses:
        '200':
          description: Job readiness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobReadiness'
  /api/v1/jobs/{job_id}/events:
    post:
      tags:
      - Jobs
      summary: Report asynchronous job lifecycle event
      description: 'External job executors call this endpoint after a worker dispatches them.
        Supported statuses are `started`, `heartbeat`, `succeeded`, and `failed`.
        '       
      parameters:
      - $ref: '#/components/parameters/JobID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobEvent'
      responses:
        '204':
          description: Event accepted.
  /api/v1/admin/check/global-cycles:
    get:
      tags:
      - Admin
      summary: Check for cycles across stored DAG versions
      responses:
        '200':
          description: Cycle report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalCycleCheckResponse'
  /internal/workers/lease:
    post:
      tags:
      - Worker Gateway
      summary: Lease queued jobs for dispatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaseRequest'
      responses:
        '200':
          description: Leased queue items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaseResponse'
  /internal/workers/dispatch-result:
    post:
      tags:
      - Worker Gateway
      summary: Record dispatch attempt result
      description: 'Workers call this endpoint after attempting to dispatch a queued
        job to an external service. On success the job moves to `dispatched`;
        on retryable failure it returns to `queued`; on terminal failure it moves to `failed`.
        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchResult'
      responses:
        '204':
          description: Dispatch result recorded.
components:
  parameters:
    NamespaceName:
      name: name
      in: path
      required: true
      schema:
        type: string
    NamespaceID:
      name: namespace_id
      in: path
      required: true
      schema:
        type: string
    DefinitionID:
      name: definition_id
      in: path
      required: true
      schema:
        type: string
    DAGID:
      name: dag_id
      in: path
      required: true
      schema:
        type: string
    DAGVersionID:
      name: dag_version_id
      in: path
      required: true
      schema:
        type: string
    RunID:
      name: run_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    JobID:
      name: job_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    Namespace:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
    Schedule:
      type: object
      properties:
        type:
          type: string
          enum:
          - cron
          - interval
        cron:
          type: string
        interval_seconds:
          type: integer
        start_at:
          type: string
          format: date-time
        timezone:
          type: string
        on_failure:
          type: string
      description: 'A schedule is either cron-based or interval-based. Cron schedules
        are aligned to wall clock time. Interval schedules start from `start_at`
        and recur every `interval_seconds`.
        '
    JobDefinition:
      type: object
      properties:
        id:
          type: string
        namespace_id:
          type: string
        name:
          type: string
        description:
          type: string
        kind:
          type: string
        payload_template:
          type: object
          additionalProperties: true
        schedule:
          $ref: '#/components/schemas/Schedule'
        is_enabled:
          type: boolean
        is_paused:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    JobDefinitionCreate:
      type: object
      properties:
        namespace_id:
          type: string
        name:
          type: string
        description:
          type: string
        kind:
          type: string
        payload_template:
          type: object
          additionalProperties: true
        schedule:
          $ref: '#/components/schemas/Schedule'
        is_enabled:
          type: boolean
      required:
      - namespace_id
      - name
    DAG:
      type: object
      properties:
        id:
          type: string
        namespace_id:
          type: string
        name:
          type: string
        description:
          type: string
        active_version_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    DAGVersionNodeInput:
      type: object
      properties:
        node_key:
          type: string
        display_name:
          type: string
        job_definition_id:
          type: string
      required:
      - node_key
      - display_name
      - job_definition_id
    DAGVersionEdgeInput:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
      required:
      - from
      - to
    DAGVersionCreate:
      type: object
      properties:
        version_note:
          type: string
        based_on_version_id:
          type: string
          nullable: true
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DAGVersionNodeInput'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/DAGVersionEdgeInput'
    DAGVersion:
      type: object
      properties:
        id:
          type: string
        dag_id:
          type: string
        version_number:
          type: integer
        version_note:
          type: string
        based_on_version_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    DAGVersionNode:
      type: object
      properties:
        id:
          type: string
        node_key:
          type: string
        display_name:
          type: string
        job_definition_id:
          type: string
        job_definition_name:
          type: string
        schedule:
          $ref: '#/components/schemas/Schedule'
    DAGVersionGraph:
      type: object
      properties:
        version:
          $ref: '#/components/schemas/DAGVersion'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DAGVersionNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/DAGVersionGraphEdge'
    RunTrigger:
      type: object
      properties:
        type:
          type: string
        definition_id:
          type: string
          nullable: true
        definition_name:
          type: string
          nullable: true
    Run:
      type: object
      properties:
        id:
          type: integer
          format: int64
        dag_id:
          type: string
        dag_version_id:
          type: string
        dag_name:
          type: string
        version_number:
          type: integer
        trigger:
          $ref: '#/components/schemas/RunTrigger'
        status:
          type: string
          enum:
          - waiting
          - running
          - succeeded
          - failed
          - missed
          - cancelled
        scheduled_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
    RunJob:
      type: object
      properties:
        job_id:
          type: integer
          format: int64
        run_id:
          type: integer
          format: int64
        node_key:
          type: string
        display_name:
          type: string
        job_definition_id:
          type: string
        job_definition_name:
          type: string
        status:
          type: string
          enum:
          - waiting
          - queued
          - dispatching
          - dispatched
          - running
          - succeeded
          - failed
          - lost
          - missed
          - blocked
          - cancelled
          - skipped
        due_at:
          type: string
          format: date-time
        dispatched_at:
          type: string
          format: date-time
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        last_heartbeat_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        external_execution_id:
          type: string
          nullable: true
        reason_code:
          type: string
          nullable: true
        last_error:
          type: string
          nullable: true
        is_ready:
          type: boolean
          nullable: true
    RunGraph:
      type: object
      properties:
        run:
          $ref: '#/components/schemas/Run'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/RunJob'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/RunGraphEdge'
    BlockingParent:
      type: object
      properties:
        job_id:
          type: integer
          format: int64
        node_key:
          type: string
        status:
          type: string
    ProblemJob:
      type: object
      properties:
        job_id:
          type: integer
          format: int64
        run_id:
          type: integer
          format: int64
        namespace_id:
          type: string
        dag_id:
          type: string
        dag_name:
          type: string
        node_key:
          type: string
        display_name:
          type: string
        status:
          type: string
        dispatch_attempts:
          type: integer
        reason_code:
          type: string
          nullable: true
        reason_detail:
          type: string
          nullable: true
        last_error:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        is_ready:
          type: boolean
        is_restartable:
          type: boolean
    RestartJobRequest:
      type: object
      properties:
        cascade:
          type: boolean
          nullable: true
    RestartJobResult:
      type: object
      properties:
        job_id:
          type: integer
          format: int64
        run_id:
          type: integer
          format: int64
        cascade:
          type: boolean
        reset_job_ids:
          type: array
          items:
            type: integer
            format: int64
        restarted_at:
          type: string
          format: date-time
    JobReadiness:
      type: object
      properties:
        job_id:
          type: integer
          format: int64
        status:
          type: string
        is_ready:
          type: boolean
        blocking_upstreams:
          type: array
          items:
            $ref: '#/components/schemas/BlockingParent'
    JobEvent:
      type: object
      properties:
        status:
          type: string
          enum:
          - started
          - heartbeat
          - succeeded
          - failed
        external_execution_id:
          type: string
        heartbeat_at:
          type: string
          format: date-time
        reason_code:
          type: string
        reason_detail:
          type: string
      required:
      - status
    LeaseRequest:
      type: object
      properties:
        worker_id:
          type: string
        max_jobs:
          type: integer
      required:
      - worker_id
    QueueItem:
      type: object
      properties:
        queue_id:
          type: integer
          format: int64
        job_id:
          type: integer
          format: int64
        attempts:
          type: integer
        priority:
          type: integer
        node_key:
          type: string
        kind:
          type: string
        payload:
          type: object
          additionalProperties: true
        definition_id:
          type: string
    DispatchResult:
      type: object
      properties:
        worker_id:
          type: string
        queue_id:
          type: integer
          format: int64
        job_id:
          type: integer
          format: int64
        success:
          type: boolean
        retryable:
          type: boolean
        reason_code:
          type: string
        reason_detail:
          type: string
        external_execution_id:
          type: string
      required:
      - worker_id
      - queue_id
      - job_id
      - success
    DefinitionUsage:
      type: object
      properties:
        dag_id:
          type: string
        dag_name:
          type: string
        dag_version_id:
          type: string
        version_number:
