services:
  db:
    image: postgres:18
    container_name: chronosched-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chronosched
    ports:
      - "5432:5432"
    volumes:
      - ./migrate/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chronosched"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/chronosched?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/chronosched?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      CHRONOSCHED_BASE_URL: http://server:8080
    depends_on:
      server:
        condition: service_started
      scheduler:
        condition: service_started

  python-service:
    build:
      context: ./client/python
      dockerfile: Dockerfile.python
    environment:
      PYTHONUNBUFFERED: "1"
      CHRONOSCHED_BASE: http://server:8080
      SERVICE_HOST: python-service
      PORT: "8090"
    depends_on:
      server:
        condition: service_started
      scheduler:
        condition: service_started
    ports:
      - "8090:8090"
