services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.debug.server
    environment:
      PORT: ${SERVER_PORT:-8080}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
      - "40000:40000"
    volumes:
      - ./cmd/server:/src/cmd/server:ro   # read-only source mount

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.debug.scheduler
    ports:
      - "40002:40002"
    volumes:
      - ./cmd/scheduler:/src/cmd/scheduler:ro

  worker:
    build:
      context: .
      dockerfile: Dockerfile.debug.worker
    environment:
      CHRONOSCHED_BASE_URL: ${CHRONOSCHED_BASE_URL:-http://server:${SERVER_PORT:-8080}}
    ports:
      - "40001:40001"
    volumes:
      - ./cmd/worker:/src/cmd/worker:ro   # read-only source mount

  demo:
    build:
      context: ./client/python
      dockerfile: Dockerfile.python
    working_dir: /app
    volumes:
      - ./client/python:/app
    environment:
      PYTHONUNBUFFERED: "1"
      CHRONOSCHED_BASE: ${CHRONOSCHED_BASE_URL:-http://server:${SERVER_PORT:-8080}}
    command: >
      python -m debugpy
        --listen 0.0.0.0:5678
        --wait-for-client
        demo_client.py
    ports:
      - "5678:5678"
